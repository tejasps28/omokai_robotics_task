name: omokai-task1

services:
  robot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: omokai-task1:latest
    container_name: omokai-task1
    init: true
    network_mode: host
    ipc: host
    shm_size: 512mb
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      TURTLEBOT3_MODEL: ${TURTLEBOT3_MODEL:-waffle_pi}
      GZ_VERBOSITY: ${GZ_VERBOSITY:-2}
      GZ_SIM_HEADLESS_RENDERING: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OMOKAI_OPENAI_MODEL: ${OMOKAI_OPENAI_MODEL:-gpt-5.6}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OMOKAI_GEMINI_MODEL: ${OMOKAI_GEMINI_MODEL:-gemini-2.5-flash}
      OMOKAI_MODE: ${OMOKAI_MODE:-core}
      OMOKAI_MAP_FILE: ${OMOKAI_MAP_FILE:-}
      OMOKAI_DEMO_MAX_SPEED_MPS: ${OMOKAI_DEMO_MAX_SPEED_MPS:-0.18}
      OMOKAI_ACTOR_MOTION: ${OMOKAI_ACTOR_MOTION:-false}
      OMOKAI_RED_ACTOR: ${OMOKAI_RED_ACTOR:-false}
    volumes:
      - type: bind
        source: ./runtime/artifacts
        target: /data/artifacts
      - type: bind
        source: ./runtime/ros_logs
        target: /home/omokai/.ros
      - type: bind
        source: ./runtime/maps
        target: /data/maps
      - type: bind
        source: ./runtime/test_reports
        target: /data/test_reports
      - type: bind
        source: ./runtime/assets
        target: /data/assets
        read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      - ros2
      - launch
      - omokai_bringup
      - ${OMOKAI_LAUNCH_FILE:-core_navigation.launch.py}
      - gui:=${OMOKAI_GUI:-false}
      - map:=${OMOKAI_MAP_FILE:-unused}
    healthcheck:
      test: ["CMD", "/usr/local/bin/omokai-healthcheck"]
      interval: 5s
      timeout: 20s
      retries: 24
      start_period: 30s
    stop_grace_period: 20s
